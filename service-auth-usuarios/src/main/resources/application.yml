server:
  port: 8083

spring:
  application:
    name: service-auth-usuarios

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talleres_ph_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    # Sin valor por defecto: la contraseña se entrega solo por variable de entorno
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

jwt:
  # Base64 de al menos 32 bytes. Sin valor por defecto: usar variable de entorno JWT_SECRET
  secret: ${JWT_SECRET}
  # Milisegundos (86400000 = 24 horas)
  expiration: ${JWT_EXPIRATION:86400000}

app:
  auth:
    # Rol que se asigna a todo usuario que se registra desde el endpoint público
    default-role: ${DEFAULT_ROLE:VECINO}
