services:

 db:
  image: postgres:15-alpine
  container_name: talleres-postgres
  restart: unless-stopped
  environment:
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  ports:
    - "5432:5432"
  volumes:
  - postgres_data:/var/lib/postgresql/data
  - ./db/schema_unificado.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
  - talleres-net


 service-auth-usuarios:
  build:
    context: ./service-auth-usuarios
    dockerfile: Dockerfile
  container_name: talleres-auth
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    JWT_EXPIRATION: ${JWT_EXPIRATION}
    DEFAULT_ROLE: ${DEFAULT_ROLE}
  ports:
    - "8083:8083"
  networks:
    - talleres-net


 service-catalogo-sucursales:
  build:
    context: ./service-catalogo-sucursales
    dockerfile: Dockerfile
  container_name: talleres-catalogo
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
  ports:
   - "8081:8081"
  networks:
  - talleres-net


 service-inscripciones-gestion:
  build:
    context: ./service-inscripciones-gestion
    dockerfile: Dockerfile
  container_name: talleres-inscripciones
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
  ports:
  - "8082:8082"
  networks:
  - talleres-net


 service-biometria:
  build:
    context: ./service-biometria
    dockerfile: Dockerfile
  container_name: talleres-biometria
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    SERVER_PORT: 8084
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
  ports:
  - "8084:8084"
  networks:
  - talleres-net


volumes:
 postgres_data:
  driver: local

networks:
 talleres-net:
  driver: bridge